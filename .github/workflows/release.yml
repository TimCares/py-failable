name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two releases compute a version at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # push the version commit and tag
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release needs the full history
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Decide the version, update the changelog, build
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach the distributions to the GitHub release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
